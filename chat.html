<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RuppyNetwork Party Room</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
  body{background:#000;color:#fff;height:100vh;overflow:hidden}
  
  /* Background */
  .bg{position:fixed;inset:0;background:url('https://i.imgur.com/8QZk9bL.jpg') center/cover no-repeat;filter:brightness(0.6)}
  
  .container{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}
  
  /* Top Header */
  .header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(0,0,0,0.3)}
  .room-info{font-size:13px}
  .room-info b{font-size:16px}
  .online{color:#FFD700;font-weight:600}
  .icons{display:flex;gap:15px;font-size:20px}
  
  /* Mic Seats */
  .mic-area{padding:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .mic{width:65px;text-align:center}
  .mic-avatar{width:60px;height:60px;border-radius:50%;border:3px solid #FFD700;background:#222;display:flex;align-items:center;justify-content:center;position:relative;margin:auto}
  .mic-avatar.locked{background:#333;border-color:#555}
  .mic-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .mic-rank{position:absolute;top:-5px;left:-5px;background:#FFD700;color:#000;font-size:10px;font-weight:700;padding:2px 5px;border-radius:50%}
  .mic-name{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  
  /* Chat Area */
  .chat-area{flex:1;background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);padding:10px;overflow-y:auto}
  .system-msg{background:rgba(255,255,255,0.1);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:12px;color:#FFD700}
  .system-msg b{color:#fff}
  .chat-msg{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
  .chat-msg img{width:28px;height:28px;border-radius:50%}
  .chat-bubble{background:rgba(255,255,255,0.15);padding:6px 10px;border-radius:12px;font-size:13px;max-width:80%}
  .chat-bubble .name{color:#FFD700;font-weight:600;font-size:11px}
  
  /* Bottom Input */
  .bottom-bar{display:flex;align-items:center;padding:8px 10px;background:rgba(0,0,0,0.5);gap:10px}
  .bottom-bar input{flex:1;background:rgba(255,255,255,0.1);border:none;border-radius:20px;padding:10px 15px;color:#fff;outline:none}
  .bottom-bar .icon-btn{font-size:22px;cursor:pointer}
  .gift-btn{background:linear-gradient(135deg,#FF6B9D,#C44569);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">

  <div class="header">
    <div class="room-info">
      <b>30+Ip</b><br>
      Online: <span class="online" id="onlineCount">36</span>
    </div>
    <div class="icons">📤 📋 ⋯</div>
  </div>

  <!-- MIC SEATS -->
  <div class="mic-area">
    <div class="mic">
      <div class="mic-avatar"><span class="mic-rank">1</span>👑</div>
      <div class="mic-name">Eagle</div>
    </div>
    <div class="mic">
      <div class="mic-avatar"><span class="mic-rank">2</span>😎</div>
      <div class="mic-name">J YASIR</div>
    </div>
    <div class="mic">
      <div class="mic-avatar locked">🔒</div>
      <div class="mic-name">NO.3</div>
    </div>
    <div class="mic">
      <div class="mic-avatar"><span class="mic-rank" style="background:#ff4d4d">4</span>😘</div>
      <div class="mic-name">ONayuq...</div>
    </div>
    <div class="mic">
      <div class="mic-avatar"><span class="mic-rank" style="background:#4da6ff">5</span>😎</div>
      <div class="mic-name">Im...</div>
    </div>
    <div class="mic"><div class="mic-avatar locked">🔒</div><div class="mic-name">NO.6</div></div>
    <div class="mic"><div class="mic-avatar locked">🔒</div><div class="mic-name">NO.7</div></div>
    <div class="mic"><div class="mic-avatar locked">🔒</div><div class="mic-name">NO.8</div></div>
  </div>

  <!-- CHAT -->
  <div class="chat-area" id="chatArea">
    <div class="system-msg">17:38 [Constellation Magic] has begun! Participate in events and claim great rewards! <b style="float:right;background:#FFD700;color:#000;padding:2px 8px;border-radius:6px">go</b></div>
    <div class="system-msg">17:38 [Recharge Carnival] is ongoing! Come join in now! <b style="float:right;background:#FFD700;color:#000;padding:2px 8px;border-radius:6px">Go</b></div>
    <div class="chat-msg"><img src="https://i.pravatar.cc/40?1"><div class="chat-bubble"><div class="name">Bollo</div>entered the chat room</div></div>
  </div>

  <!-- INPUT -->
  <div class="bottom-bar">
    <input type="text" id="msgInput" placeholder="Send a message...">
    <div class="icon-btn">😊</div>
    <div class="icon-btn">🎁</div>
    <div class="icon-btn gift-btn" onclick="sendMsg()">🎁</div>
  </div>

</div>

<script>
let userName = window.userData?.name || "You";

function sendMsg(){
  let input = document.getElementById("msgInput");
  let text = input.value.trim();
  if(!text) return;
  
  let chatArea = document.getElementById("chatArea");
  let msg = document.createElement("div");
  msg.className = "chat-msg";
  msg.innerHTML = `<img src="https://i.pravatar.cc/40"><div class="chat-bubble"><div class="name">${userName}</div>${text}</div>`;
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
  input.value = "";
}

document.getElementById("msgInput").addEventListener("keypress", e=>{
  if(e.key === "Enter") sendMsg();
});
</script>
</body>
</html>
