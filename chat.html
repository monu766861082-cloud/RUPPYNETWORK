<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuppyNetwork Chat Room</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Poppins', sans-serif;}
  body{background: linear-gradient(135deg,#667eea 0%, #764ba2 100%);height:100vh;display:flex;justify-content:center;align-items:center;}
  
  .chat-container{
    width: 100%; max-width: 500px; height: 100vh;
    background: #fff; display:flex; flex-direction:column; overflow:hidden;
  }
  
  .chat-header{
    background: #667eea; color:#fff; padding:15px;
    text-align:center; font-weight:600; font-size:18px;
    position:sticky; top:0; z-index:10;
  }
  
  .chat-box{
    flex:1; padding:15px; overflow-y:auto; background:#f5f5f5;
    display:flex; flex-direction:column; gap:10px; padding-bottom:80px;
  }
  
  .msg{
    max-width:75%; padding:10px 15px; border-radius:18px;
    font-size:14px; line-height:1.4; word-wrap:break-word;
  }
  
  .msg.me{
    background:#667eea; color:#fff; align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  
  .msg.other{
    background:#e5e5ea; color:#000; align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  
  .msg .name{
    font-size:11px; font-weight:600; margin-bottom:3px; opacity:0.8;
  }
  
  .chat-input{
    display:flex; padding:10px; background:#fff; border-top:1px solid #ddd;
    position:fixed; bottom:0; left:0; right:0; max-width:500px; margin:auto;
  }
  
  .chat-input input{
    flex:1; border:none; outline:none; padding:12px 15px;
    border-radius:25px; background:#f1f1f1; font-size:14px;
  }
  
  .chat-input button{
    background:#667eea; color:#fff; border:none; 
    padding:0 20px; margin-left:8px; border-radius:25px;
    font-weight:600; cursor:pointer;
  }
  .chat-input button:active{transform:scale(0.95);}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🎉 RuppyNetwork Party Room</div>
  
  <div class="chat-box" id="chatBox">
    <div class="msg other">
      <div class="name">Admin</div>
      Welcome to RuppyNetwork Chat! 🎊
    </div>
  </div>
  
  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="Type a message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
  let userName = window.userData?.name || "Guest"; // agar login hai to naam le lega
  
  function sendMsg(){
    let input = document.getElementById("msgInput");
    let text = input.value.trim();
    if(text === "") return;
    
    let chatBox = document.getElementById("chatBox");
    
    // apna message
    let myMsg = document.createElement("div");
    myMsg.className = "msg me";
    myMsg.innerHTML = `<div class="name">${userName}</div>${text}`;
    chatBox.appendChild(myMsg);
    
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
    
    // demo reply
    setTimeout(()=>{
      let reply = document.createElement("div");
      reply.className = "msg other";
      reply.innerHTML = `<div class="name">Guest123</div> Nice!`;
      chatBox.appendChild(reply);
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 1000);
  }
  
  // Enter se send
  document.getElementById("msgInput").addEventListener("keypress", function(e){
    if(e.key === "Enter"){ sendMsg(); }
  });
</script>

</body>
</html>
