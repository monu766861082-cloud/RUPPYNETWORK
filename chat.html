<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RuppyNetwork Party Room</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
  body{background:#000;color:#fff;height:100vh;overflow:hidden}
 .bg{position:fixed;inset:0;background:#0a0a0a url('https://i.imgur.com/5QZk9bL.jpg') center/cover no-repeat;filter:brightness(0.4)}
 .container{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}
 .header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(0,0,0,0.4)}
 .room-info{font-size:13px}.room-info b{font-size:16px}.online{color:#FFD700;font-weight:600}
 .mic-area{padding:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:15px}
 .mic{width:70px;text-align:center}
 .mic-avatar{width:65px;height:65px;border-radius:50%;border:3px solid #444;background:#222;display:flex;align-items:center;justify-content:center;position:relative;margin:auto;cursor:pointer}
 .mic-avatar.active{border-color:#FFD700;box-shadow:0 0 15px #FFD700}
 .mic-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
 .mic-rank{position:absolute;top:-5px;left:-5px;background:#FFD700;color:#000;font-size:10px;font-weight:700;width:20px;height:20px;line-height:20px;border-radius:50%}
 .mic-name{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .chat-area{flex:1;background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);padding:10px;overflow-y:auto}
 .system-msg{background:rgba(0,0,0.4);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:12px;color:#ccc}
 .system-msg.go{float:right;background:#FFD700;color:#000;padding:2px 10px;border-radius:6px;font-weight:600}
 .chat-msg{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
 .chat-msg img{width:30px;height:30px;border-radius:50%}
 .chat-bubble{background:rgba(40,40,40,0.8);padding:6px 10px;border-radius:12px;font-size:13px;max-width:80%}
 .chat-bubble.name{color:#FFD700;font-weight:600;font-size:11px}
 .bottom-bar{display:flex;align-items:center;padding:8px 10px;background:rgba(0,0,0,0.6);gap:10px}
 .bottom-bar input{flex:1;background:rgba(255,255,255,0.1);border:none;border-radius:20px;padding:10px 15px;color:#fff;outline:none}
 .gift-btn{background:#FFD700;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="header">
    <div class="room-info"><b>30+Ip</b><br>Online: <span class="online" id="onlineCount">1</span></div>
    <div>📤 📋 ⋯</div>
  </div>

  <div class="mic-area" id="micArea"></div>

  <div class="chat-area" id="chatArea">
    <div class="system-msg">17:38 [Constellation Magic] has begun! Participate in events <span class="go">go</span></div>
  </div>

  <div class="bottom-bar">
    <input type="text" id="msgInput" placeholder="Send a message...">
    <div class="gift-btn" onclick="sendMsg()">➤</div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// 1. Yaha apna Firebase config daalo
const firebaseConfig = {
  apiKey: "TUMHARA_API_KEY",
  authDomain: "TUMHARA_PROJECT.firebaseapp.com",
  databaseURL: "https://TUMHARA_PROJECT-default-rtdb.firebaseio.com",
  projectId: "TUMHARA_PROJECT",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const roomId = "party_room_1";
const user = window.userData || {name: "Guest", uid: Date.now(), dp: ""};

// MIC SEATS BANANA
const micArea = document.getElementById("micArea");
for(let i=1; i<=8; i++){
  micArea.innerHTML += `<div class="mic" onclick="takeMic(${i})">
    <div class="mic-avatar" id="mic${i}"><span class="mic-rank">${i}</span>🔒</div>
    <div class="mic-name" id="micName${i}">NO.${i}</div>
  </div>`;
}

// CHAT SUNNA
const chatRef = ref(db, `rooms/${roomId}/chat`);
onChildAdded(chatRef, (snap) => {
  const msg = snap.val();
  const chatArea = document.getElementById("chatArea");
  let html = `<div class="chat-msg">
    <img src="${msg.dp || 'https://i.pravatar.cc/40'}">
    <div class="chat-bubble"><div class="name">${msg.name}</div>${msg.text}</div>
  </div>`;
  chatArea.innerHTML += html;
  chatArea.scrollTop = chatArea.scrollHeight;
});

// MSG BHEJNA
window.sendMsg = function(){
  let input = document.getElementById("msgInput");
  let text = input.value.trim();
  if(!text) return;
  push(chatRef, {name: user.name, text: text, dp: user.dp, time: serverTimestamp()});
  input.value = "";
}

// MIC LENA
window.takeMic = function(seatNo){
  set(ref(db, `rooms/${roomId}/mics/${seatNo}`), {name: user.name, dp: user.dp});
}

// MIC UPDATE SUNNA
const micRef = ref(db, `rooms/${roomId}/mics`);
onValue(micRef, (snap) => {
  const mics = snap.val() || {};
  for(let i=1; i<=8; i++){
    let mic = document.getElementById(`mic${i}`);
    let name = document.getElementById(`micName${i}`);
    if(mics[i]){
      mic.classList.add("active");
      mic.innerHTML = `<span class="mic-rank">${i}</span><img src="${mics[i].dp || 'https://i.pravatar.cc/60'}">`;
      name.innerText = mics[i].name;
    } else {
      mic.classList.remove("active");
      mic.innerHTML = `<span class="mic-rank">${i}</span>🔒`;
      name.innerText = `NO.${i}`;
    }
  }
})

// ONLINE COUNT
set(ref(db, `rooms/${roomId}/online/${user.uid}`), true);
onValue(ref(db, `rooms/${roomId}/online`), (snap) => {
  document.getElementById("onlineCount").innerText = snap.size || 1;
});

document.getElementById("msgInput").addEventListener("keypress", e=>{ if(e.key === "Enter") sendMsg(); });
</script>
</body>
</html>
